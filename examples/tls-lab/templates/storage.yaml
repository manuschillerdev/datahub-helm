apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: {app: tls-lab-mysql}
  ports: [{name: mysql, port: 3306}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: tls-lab-mysql}
  template:
    metadata:
      labels: {app: tls-lab-mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.2
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: tls-lab-credentials, key: MYSQL_ROOT_PASSWORD}
            - {name: MYSQL_DATABASE, value: datahub}
          ports: [{containerPort: 3306}]
          readinessProbe:
            exec:
              command: [sh, -ec, 'mysqladmin ping -h 127.0.0.1 -p"$MYSQL_ROOT_PASSWORD" --silent']
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 3Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
spec:
  selector: {app: tls-lab-opensearch}
  ports: [{name: http, port: 9200}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels: {app: tls-lab-opensearch}
  template:
    metadata:
      labels: {app: tls-lab-opensearch}
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.3
          env:
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          args: ["-Enode.store.allow_mmap=false"]
          ports: [{containerPort: 9200}]
          readinessProbe:
            httpGet: {path: /_cluster/health, port: 9200}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /usr/share/opensearch/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 3Gi}
