apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-lab-actions
data:
  tls-lab.yaml: |
    {{- .Files.Get "scenarios/actions.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-lab-verification
data:
  kafka.yaml: |
    {{- .Files.Get "scenarios/kafka.yaml" | nindent 4 }}
  verify.py: |
    {{- .Files.Get "scenarios/verify.py" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-lab-verifier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tls-lab-verifier
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tls-lab-verifier
subjects:
  - kind: ServiceAccount
    name: tls-lab-verifier
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tls-lab-verifier
